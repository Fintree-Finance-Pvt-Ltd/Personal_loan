openapi: 3.0.3
info:
  title: Fintree Finance Lender Integration API
  version: "1.0.0"
  description: |
    API specifications for the Personal Loan Platform (PLP) to communicate with Fintree Finance.
    Implements a strict zero-trust model utilizing x-api-key authentication.
    Constraints:
      - Document size strictly limited to 3.5 MiB.
      - Masked Aadhaar details only.
      - Allowed Document MIME types: application/xml, text/xml, application/pdf.
servers:
  - url: https://uat.fintreelms.com/
    description: UAT Environment Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - correlationId
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        correlationId:
          type: string
          format: uuid

    CreateApplicationRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - sourceSystem
        - productCode
        - customer
        - panVerification
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        sourceSystem:
          type: string
          enum: [FINTREE_PLP]
        productCode:
          type: string
        customer:
          type: object
        panVerification:
          type: object

    CreateApplicationResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - externalApplicationReference
            - lan
            - status
            - partnerApplicationId
            - partnerApplicationNumber
            - createdAt
          properties:
            externalApplicationReference:
              type: string
            lan:
              type: string
            status:
              type: string
              enum: [CREATED]
            partnerApplicationId:
              type: string
            partnerApplicationNumber:
              type: string
            createdAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    SubmitConsentRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - consentType
        - consentId
        - consentTemplateId
        - consentVersion
        - consentTextHash
        - acceptedAt
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        consentType:
          type: string
        consentId:
          type: string
        consentTemplateId:
          type: string
        consentVersion:
          type: string
        consentTextHash:
          type: string
        consentReference:
          type: string
        acceptedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgentHash:
          type: string

    SubmitConsentResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - status
            - consentReference
            - recordedAt
          properties:
            status:
              type: string
              enum: [RECORDED]
            consentReference:
              type: string
            recordedAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    UpdateDetailsRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - detailsVersion
        - customer
        - employment
        - aadhaarKyc
        - permanentAddress
        - currentAddress
        - currentAddressEvidence
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        detailsVersion:
          type: number
        customer:
          type: object
        employment:
          type: object
        aadhaarKyc:
          type: object
        permanentAddress:
          type: object
        currentAddress:
          type: object
        currentAddressEvidence:
          type: object

    UpdateDetailsResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - detailsVersion
            - status
            - updatedAt
          properties:
            detailsVersion:
              type: number
            status:
              type: string
              enum: [DETAILS_ACCEPTED]
            updatedAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    UploadDocumentRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - documentType
        - sourceDocumentId
        - fileName
        - mimeType
        - fileSize
        - fileSha256
        - contentBase64
        - source
        - capturedAt
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        documentType:
          type: string
        sourceDocumentId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: number
        fileSha256:
          type: string
        contentBase64:
          type: string
        source:
          type: string
        capturedAt:
          type: string
          format: date-time

    UploadDocumentResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - documentType
            - fileSha256
            - status
            - partnerDocumentId
            - receivedAt
          properties:
            documentType:
              type: string
            fileSha256:
              type: string
            status:
              type: string
              enum: [RECEIVED]
            partnerDocumentId:
              type: string
            receivedAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

security:
  - ApiKeyAuth: []

paths:
  /applications:
    post:
      summary: Create Application
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        "200":
          description: Acknowledged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/consents:
    post:
      summary: Submit Consent
      operationId: submitConsent
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitConsentRequest'
      responses:
        "200":
          description: Consent recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitConsentResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/details:
    put:
      summary: Update Application Details
      operationId: updateDetails
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDetailsRequest'
      responses:
        "200":
          description: Details accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDetailsResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/documents:
    post:
      summary: Upload Document
      operationId: uploadDocument
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        "200":
          description: Document received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

