openapi: 3.0.3
info:
  title: Fintree Finance Lender Integration API
  version: "1.0.0"
  description: |
    API specifications for the Personal Loan Platform (PLP) to communicate with Fintree Finance.
    Implements a strict zero-trust model utilizing x-api-key authentication.
    Constraints:
      - Document size strictly limited to 3.5 MiB.
      - Masked Aadhaar details only.
      - Allowed Document MIME types: application/xml, text/xml, application/pdf.
servers:
  - url: https://uat.fintreelms.com/
    description: UAT Environment Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - correlationId
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        correlationId:
          type: string
          format: uuid

    CreateApplicationRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - sourceSystem
        - productCode
        - requestedAmount
        - customer
        - panVerification
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        sourceSystem:
          type: string
          enum: [FINTREE_PLP]
        productCode:
          type: string
        requestedAmount:
          type: string
          description: Deterministic initial amount requested from the lender, computed from the allocated product's multiplier/rounding rules before any lender decision exists.
        requestedTenure:
          type: number
          nullable: true
          description: Initial tenure requested, taken from the allocated product's configured tenure list (lowest sort order).
        tenureType:
          type: string
          nullable: true
          enum: [DAYS, MONTHS]
        interestRate:
          type: string
          nullable: true
          description: Annual interest rate percent, from the allocated product version's configured annualRoiPercent.
        processingFeePercent:
          type: string
          nullable: true
          description: Processing fee percent, from the allocated product version's configured processingFeePercent.
        customer:
          type: object
        panVerification:
          type: object

    CreateApplicationResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - externalApplicationReference
            - lan
            - status
            - partnerApplicationId
            - partnerApplicationNumber
            - createdAt
          properties:
            externalApplicationReference:
              type: string
            lan:
              type: string
            status:
              type: string
              enum: [CREATED]
            partnerApplicationId:
              type: string
            partnerApplicationNumber:
              type: string
            createdAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    SubmitConsentRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - consentType
        - consentId
        - consentTemplateId
        - consentVersion
        - consentTextHash
        - acceptedAt
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        consentType:
          type: string
        consentId:
          type: string
        consentTemplateId:
          type: string
        consentVersion:
          type: string
        consentTextHash:
          type: string
        consentReference:
          type: string
        acceptedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgentHash:
          type: string

    SubmitConsentResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - status
            - consentReference
            - recordedAt
          properties:
            status:
              type: string
              enum: [RECORDED]
            consentReference:
              type: string
            recordedAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    UpdateDetailsRequest:
      type: object
      description: |
        Staged/versioned profile update. This same endpoint is called multiple times over an
        application's lifecycle, once per stage, with detailsVersion strictly increasing and
        never reused: V1 (onboarding profile, before the first/pre-approval decision), V2 (after
        the customer selects an offer within the lender's pre-approval credit limit, before the
        final decision call), V3 (after backend bank-account verification succeeds), V4 (after
        the eNACH mandate is authorized). selectedOffer/bankDetails/mandate are included only once
        the corresponding stage's data exists — earlier snapshots are never overwritten, each
        version is sent and tracked independently.
      required:
        - externalApplicationReference
        - lan
        - detailsVersion
        - customer
        - employment
        - aadhaarKyc
        - permanentAddress
        - currentAddress
        - currentAddressEvidence
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        detailsVersion:
          type: number
        customer:
          type: object
        employment:
          type: object
        aadhaarKyc:
          type: object
        permanentAddress:
          type: object
        currentAddress:
          type: object
        currentAddressEvidence:
          type: object
        selectedOffer:
          type: object
          nullable: true
          description: Present from V2 onward, once the customer has selected an amount/tenure within the pre-approval credit limit.
          properties:
            amount:
              type: string
            tenure:
              type: number
            selectedAt:
              type: string
              format: date-time
        bankDetails:
          type: object
          nullable: true
          description: Present from V3 onward, once backend bank-account verification has succeeded. Sourced only from the verified backend record, never raw customer input.
          properties:
            accountHolderName:
              type: string
            accountNumber:
              type: string
            ifscCode:
              type: string
            bankName:
              type: string
            accountType:
              type: string
            verifiedAt:
              type: string
              format: date-time
        mandate:
          type: object
          nullable: true
          description: Present from V4 onward, once the eNACH mandate webhook has authorized the mandate. UMRN is sourced only from the verified webhook/provider record.
          properties:
            umrn:
              type: string
            provider:
              type: string
            mandateType:
              type: string
            authorizedAt:
              type: string
              format: date-time

    UpdateDetailsResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - detailsVersion
            - status
            - updatedAt
          properties:
            detailsVersion:
              type: number
            status:
              type: string
              enum: [DETAILS_ACCEPTED]
            updatedAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    UploadDocumentRequest:
      type: object
      required:
        - externalApplicationReference
        - lan
        - documentType
        - sourceDocumentId
        - fileName
        - mimeType
        - fileSize
        - fileSha256
        - contentBase64
        - source
        - capturedAt
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        documentType:
          type: string
        sourceDocumentId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: number
        fileSha256:
          type: string
        contentBase64:
          type: string
        source:
          type: string
        capturedAt:
          type: string
          format: date-time

    UploadDocumentResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - documentType
            - fileSha256
            - status
            - partnerDocumentId
            - receivedAt
          properties:
            documentType:
              type: string
            fileSha256:
              type: string
            status:
              type: string
              enum: [RECEIVED]
            partnerDocumentId:
              type: string
            receivedAt:
              type: string
              format: date-time
        correlationId:
          type: string
          format: uuid

    DecisionRequest:
      type: object
      description: |
        This same endpoint is called twice per application, distinguished only by
        Idempotency-Key (…:LENDER_REQUEST_DECISION:V1 for the pre-approval call, …:V2 for the
        final approval call made after the customer selects an offer) — the request body shape
        is identical for both calls; the amount/tenure/offer context Fintree needs comes from the
        profile (details) updates, not from this payload.
      required:
        - externalApplicationReference
        - productCode
        - bureauConsent
        - decisionConsent
      properties:
        externalApplicationReference:
          type: string
        productCode:
          type: string
        bureauConsent:
          type: object
          required: [reference, hash]
          properties:
            reference:
              type: string
            hash:
              type: string
        decisionConsent:
          type: object
          required: [reference, hash]
          properties:
            reference:
              type: string
            hash:
              type: string

    DecisionResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - status
          description: |
            On the pre-approval (V1) call, an "approved" status carries the credit limit in
            CREDIT_LIMIT_CHECK_RPM and is persisted as a pre-approval only (no loan created yet).
            On the final (V2) call, "approved" finalizes the loan using the customer's
            already-selected amount/tenure. Either call may return a pending/processing status
            (recognized values: pending, processing, under_review, in_review, queued) — for V2
            this is the expected initial response, with the final outcome delivered later via the
            existing async decision/status mechanism. "rejected" is terminal at either stage.
          properties:
            status:
              type: string
              enum: [approved, rejected, pending, processing, under_review, in_review, queued]
            CREDIT_LIMIT_CHECK_RPM:
              type: object
              nullable: true
              description: Present only when status is "approved". Exactly one of the two derived values is populated depending on whether Fintree treats the applicant as new or repeat.
              properties:
                derived_values:
                  type: object
                  required:
                    - LIMIT_ASSIGNMENT_IS_NEW_CUSTOMER_RPM
                    - LIMIT_ASSIGNMENT_IS_REPEAT_CUSTOMER_RPM
                  properties:
                    LIMIT_ASSIGNMENT_IS_NEW_CUSTOMER_RPM:
                      type: number
                    LIMIT_ASSIGNMENT_IS_REPEAT_CUSTOMER_RPM:
                      type: number
        correlationId:
          type: string
          format: uuid

    DisburseRequest:
      type: object
      description: |
        Triggers Fintree to disburse the final accepted loan amount, sent only after
        mandate and e-sign are both complete. This call only asks Fintree to start
        disbursal — it does not itself confirm the disbursed outcome. The final result
        (UTR, status, disbursement date) arrives later, asynchronously, via the existing
        disbursal webhook (POST /webhooks/lenders/{lenderCode}/disbursal).
      required:
        - externalApplicationReference
        - lan
        - amount
        - trigger_fund
      properties:
        externalApplicationReference:
          type: string
        lan:
          type: string
        amount:
          type: string
          description: The final accepted loan amount — never the pre-approval credit limit.
        trigger_fund:
          type: boolean
          enum: [true]

    DisburseResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - status
          description: Acknowledges that the fund-trigger request was accepted — not a disbursal confirmation.
          properties:
            status:
              type: string
            disbursalReference:
              type: string
        correlationId:
          type: string
          format: uuid

security:
  - ApiKeyAuth: []

paths:
  /applications:
    post:
      summary: Create Application
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        "200":
          description: Acknowledged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/consents:
    post:
      summary: Submit Consent
      operationId: submitConsent
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitConsentRequest'
      responses:
        "200":
          description: Consent recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitConsentResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/details:
    put:
      summary: Update Application Details
      operationId: updateDetails
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDetailsRequest'
      responses:
        "200":
          description: Details accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDetailsResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/decision:
    post:
      summary: Request Lender Decision (called twice — pre-approval, then final approval)
      operationId: requestDecision
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        "200":
          description: Decision recorded (approved/rejected/pending — see DecisionResponse for stage-specific semantics)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/documents:
    post:
      summary: Upload Document
      operationId: uploadDocument
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        "200":
          description: Document received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{partnerApplicationId}/disburse:
    post:
      summary: Trigger Disbursal
      operationId: requestDisbursal
      parameters:
        - name: partnerApplicationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisburseRequest'
      responses:
        "200":
          description: Fund-trigger request accepted (not a disbursal confirmation — see the disbursal webhook)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisburseResponse'
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

